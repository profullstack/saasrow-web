name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: install, typecheck, unit tests, build (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json, the same Bun the
      # image (.nixpacks/Dockerfile) pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      # The community/newsletter/submissions suites need a live Supabase; the
      # rest run anywhere.
      - run: bun run test:unit
      - run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Standalone server answers under Bun
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 bun server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/robots.txt || true)
            [ "$code" = 200 ] && { echo "/robots.txt -> $code"; exit 0; }
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"; exit 1
