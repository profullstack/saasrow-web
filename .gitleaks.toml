# gitleaks config for saasrow-web
# Extends the default ruleset and allowlists known-public client-side
# analytics keys. These are embedded in the page HTML and served to every
# visitor (Ahrefs Web Analytics data-key, datafast data-website-id), so they
# are public identifiers, not secrets.

title = "saasrow-web"

[extend]
useDefault = true

[allowlist]
description = "Public client-side analytics keys shipped in page HTML (not secrets), and high-entropy string literals that are alphabets, not keys"
regexTarget = "line"
regexes = [
  '''data-key="jrCaJNA5B0FqNBQqJOAaYw"''',
  '''data-website-id="dfid_ymwgZYB7fCWFQQX3c74DG"''',
  # src/lib/apiKeys.ts: the character set API keys are generated from. It is
  # in git history from the first commit of the file, so an inline
  # gitleaks:allow alone would not clear the history scan.
  '''const (KEY|CODE)_ALPHABET = '[A-Za-z0-9]{20,}''',
]
